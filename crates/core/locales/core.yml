        zh-CN: 字符串缺少结束引号
        zh-TW: 字串缺少結束引號
      unterminated_regex:
        en: Unterminated regular expression
        zh-CN: 正则表达式缺少结束的 /
        zh-TW: 正規表示式缺少結束的 /
      bad_escape:
        en: Invalid escape sequence
        zh-CN: 无效的转义序列
        zh-TW: 無效的跳脫序列
      bad_number:
        en: "Invalid number '%{text}'"
        zh-CN: "无效的数字 '%{text}'"
        zh-TW: "無效的數字 '%{text}'"
      bad_date:
        en: "Invalid date '%{text}'"
        zh-CN: "无效的日期 '%{text}'"
        zh-TW: "無效的日期 '%{text}'"
      bad_ctor_arg:
        en: "Invalid argument for %{name}()"
        zh-CN: "%{name}() 的参数无效"
        zh-TW: "%{name}() 的參數無效"
      unsupported_ctor:
        en: "%{name} is not supported"
        zh-CN: "不支持 %{name}"
        zh-TW: "不支援 %{name}"
      expected_separator:
        en: "Separate statements with ';' or a new line"
        zh-CN: "多条语句之间请用 ; 或换行分隔"
        zh-TW: "多個語句之間請用 ; 或換行分隔"
      expected_statement:
        en: "Expected a statement like db.<collection>.find(…) or show collections"
        zh-CN: "这里应为 db.<集合>.find(…) 或 show collections 这样的语句"
        zh-TW: "此處應為 db.<集合>.find(…) 或 show collections 這樣的語句"
      expected_collection:
        en: Expected a collection name
        zh-CN: 这里应为集合名
        zh-TW: 此處應為集合名稱
      expected_method:
        en: Expected a method name
        zh-CN: 这里应为方法名
        zh-TW: 此處應為方法名稱
      expected_doc_array:
        en: "Expected an array of documents ([{ … }, …])"
        zh-CN: "这里应为文档数组([{ … }, …])"
        zh-TW: "此處應為文件陣列([{ … }, …])"
      expected_uint:
        en: Expected a non-negative integer
        zh-CN: 这里应为非负整数
        zh-TW: 此處應為非負整數
      missing_arg:
        en: "%{name}() is missing an argument"
        zh-CN: "%{name}() 缺少参数"
        zh-TW: "%{name}() 缺少參數"
      too_many_args:
        en: "%{name}() takes at most %{n} argument(s); options are not supported yet"
        zh-CN: "%{name}() 最多 %{n} 个参数,暂不支持 options"
        zh-TW: "%{name}() 最多 %{n} 個參數,暫不支援 options"
      update_needs_operator:
        en: "Update must use $ operators (e.g. $set); use replaceOne to replace the whole document"
        zh-CN: "更新文档必须使用 $ 操作符(如 $set);整篇替换请用 replaceOne"
        zh-TW: "更新文件必須使用 $ 運算子(如 $set);整篇取代請用 replaceOne"
      chain_only_after_find:
        en: ".%{name}() can only follow find()"
        zh-CN: ".%{name}() 只能接在 find() 后面"
        zh-TW: ".%{name}() 只能接在 find() 後面"
      unsupported_method:
        en: "%{name}() is not supported yet"
        zh-CN: "暂不支持 %{name}()"
        zh-TW: "暫不支援 %{name}()"
      unsupported_show:
        en: "Only 'show dbs' and 'show collections' are supported"
        zh-CN: "只支持 show dbs 与 show collections"
        zh-TW: "只支援 show dbs 與 show collections"
    err:
      secret_param:
        en: "Connection string option %{key} carries a secret and would be saved in plain text; remove it from the string"
        zh-CN: "连接串参数 %{key} 含有机密信息,会被明文保存到配置文件,请从连接串中去掉"
        zh-TW: "連線字串參數 %{key} 含有機密資訊,會以明文儲存在設定檔中,請從連線字串中移除"
      tls_rejected:
        en: The server rejected the TLS handshake
        zh-CN: 服务器拒绝了 TLS 握手
        zh-TW: 伺服器拒絕了 TLS 交握
      invalid_uri:
        en: Invalid MongoDB connection string
        zh-CN: MongoDB 连接串无效
        zh-TW: MongoDB 連線字串無效
      unauthorized:
        en: Not authorized for this operation
        zh-CN: 没有权限执行该操作
        zh-TW: 沒有權限執行此操作
      duplicate_key:
        en: Duplicate key (a document with this key already exists)
        zh-CN: 键重复(已存在相同键的文档)
        zh-TW: 鍵重複(已存在相同鍵的文件)
      max_time:
        en: Query exceeded 60 seconds and was stopped. Add a filter or an index.
        zh-CN: 查询超过 60 秒已终止,请增加过滤条件或索引
        zh-TW: 查詢超過 60 秒已終止,請增加篩選條件或索引
      server_selection:
        en: Cannot reach the MongoDB server (check address, network and TLS)
        zh-CN: 无法连上 MongoDB 服务器(请检查地址、网络与 TLS 设置)
        zh-TW: 無法連上 MongoDB 伺服器(請檢查位址、網路與 TLS 設定)
      command_failed:
        en: MongoDB command failed
        zh-CN: MongoDB 命令执行失败
        zh-TW: MongoDB 命令執行失敗
      no_database:
        en: No database selected. Pick one from the database list first.
        zh-CN: 尚未选择数据库,请先在库列表中选择
        zh-TW: 尚未選擇資料庫,請先在資料庫清單中選擇
      cannot_list_dbs:
        en: Not authorized to list databases. Set a default database in the connection.
        zh-CN: 无权列出数据库,请在连接中填写默认库
        zh-TW: 無權列出資料庫,請在連線中填寫預設資料庫
      doc_gone:
        en: The document was deleted or its _id changed
        zh-CN: 文档已被删除或 _id 已变化
        zh-TW: 文件已被刪除或 _id 已變更
      read_only:
        en: Write operations are not allowed in read-only mode
        zh-CN: 只读模式下不能执行写操作
        zh-TW: 唯讀模式下不能執行寫入操作
      statement_failed:
        en: "Statement %{n} failed: %{message}"
        zh-CN: "第 %{n} 条语句失败:%{message}"
        zh-TW: "第 %{n} 條語句失敗:%{message}"
    summary:
      inserted:
        en: "Inserted %{n}"
        zh-CN: "已插入 %{n} 条"
        zh-TW: "已插入 %{n} 筆"
      updated:
        en: "Matched %{matched}, modified %{modified}"
        zh-CN: "已匹配 %{matched} 条,已修改 %{modified} 条"
        zh-TW: "已比對 %{matched} 筆,已修改 %{modified} 筆"
      deleted:
        en: "Deleted %{n}"
        zh-CN: "已删除 %{n} 条"
        zh-TW: "已刪除 %{n} 筆"
      aggregate_written:
        en: Aggregation results written to the target collection
        zh-CN: 聚合结果已写入目标集合
        zh-TW: 聚合結果已寫入目標集合
  undo:
    unsupported_statement:
      en: "Undo is only available for single-table UPDATE and DELETE statements"
      zh-CN: 只有单表的 UPDATE / DELETE 能撤销
      zh-TW: 只有單表的 UPDATE / DELETE 能復原
    whole_table:
      en: "TRUNCATE and DROP TABLE can't be undone"
      zh-CN: TRUNCATE 与 DROP TABLE 不能撤销
      zh-TW: TRUNCATE 與 DROP TABLE 無法復原
    too_many_rows:
      en: "More than %{max} rows change: too many to keep for undo"
      zh-CN: 改动超过 %{max} 行,太多了,不提供撤销
      zh-TW: 變動超過 %{max} 列,太多了,不提供復原
    no_primary_key:
      en: "The table has no primary key, so the updated rows can't be found again for undo"
      zh-CN: 表没有主键,撤销时找不回被更新的行
      zh-TW: 資料表沒有主鍵,復原時找不回被更新的列
    changes_primary_key:
      en: "The UPDATE changes the primary key, so it can't be undone"
      zh-CN: 这条 UPDATE 改了主键,不能撤销
      zh-TW: 這條 UPDATE 改了主鍵,無法復原
    unknown_columns:
      en: "Couldn't tell which columns the UPDATE changes, so it can't be undone"
      zh-CN: 看不出这条 UPDATE 改了哪些列,不能撤销
      zh-TW: 看不出這條 UPDATE 改了哪些欄,無法復原
  charset:
    warning:
      en: "WARNING:"
      zh-CN: "警告:"
      zh-TW: "警告:"
    index_too_long:
      en: "Index %{index} needs %{bytes} bytes after converting to utf8mb4, over the %{limit}-byte limit (%{format}), so the conversion would fail. Switch to ROW_FORMAT=DYNAMIC, or shorten the column / index a prefix of at most %{chars} characters."
      zh-CN: "索引 %{index} 转成 utf8mb4 后要 %{bytes} 字节,超过 %{limit} 字节的上限(%{format}),转换会失败。改用 ROW_FORMAT=DYNAMIC,或把列缩短 / 改成不超过 %{chars} 个字符的前缀索引。"
      zh-TW: "索引 %{index} 轉成 utf8mb4 後要 %{bytes} 位元組,超過 %{limit} 位元組的上限(%{format}),轉換會失敗。改用 ROW_FORMAT=DYNAMIC,或把欄位縮短 / 改成不超過 %{chars} 個字元的前綴索引。"
    script_header:
      en: "Convert utf8 / utf8mb3 to utf8mb4 (Datum diagnostics, %{server}). Review before running; take a backup first."
      zh-CN: "把 utf8 / utf8mb3 转成 utf8mb4(Datum 诊断生成,%{server})。执行前请逐条核对,并先备份。"
      zh-TW: "把 utf8 / utf8mb3 轉成 utf8mb4(Datum 診斷產生,%{server})。執行前請逐條核對,並先備份。"
    script_copy:
      en: "Each ALTER TABLE … CONVERT rebuilds the table (COPY) and blocks writes while it runs: do large tables off-peak, or with gh-ost / pt-online-schema-change."
      zh-CN: "每条 ALTER TABLE … CONVERT 都会重建表(COPY),执行期间阻塞写入:大表放在低峰期,或改用 gh-ost / pt-online-schema-change。"
      zh-TW: "每條 ALTER TABLE … CONVERT 都會重建資料表(COPY),執行期間阻擋寫入:大表放在離峰時段,或改用 gh-ost / pt-online-schema-change。"
    script_schema:
      en: "Changes the default for tables created later; existing tables keep their charset."
      zh-CN: "只改以后新建表的默认字符集,已有的表不变。"
      zh-TW: "只改之後新建資料表的預設字元集,既有的表不變。"
    script_other_columns:
      en: "CONVERT also changes these columns (not utf8mb3) to %{coll}: %{cols}. Check unique keys on case- or accent-sensitive columns first."
      zh-CN: "CONVERT 也会把这些列(不是 utf8mb3)改成 %{coll}:%{cols}。区分大小写 / 重音的列上有唯一键的,先确认不会冲突。"
      zh-TW: "CONVERT 也會把這些欄位(不是 utf8mb3)改成 %{coll}:%{cols}。區分大小寫 / 重音的欄位上有唯一鍵的,先確認不會衝突。"
    script_fk:
      en: "Foreign key involved: MySQL 8.0+ rejects changing the charset of one side while foreign_key_checks = 1 (error 3780). Change both sides in one session after SET foreign_key_checks = 0, and set it back to 1 afterwards. MariaDB refuses to change a column used in a foreign key even then (error 1832): drop the foreign key first and add it back after both sides are converted."
      zh-CN: "涉及外键:MySQL 8.0+ 在 foreign_key_checks = 1 时不允许只改一侧的字符集(错误 3780)。在同一个会话里先 SET foreign_key_checks = 0,两侧一起改完再设回 1。MariaDB 即使这样也不让改外键里的列(错误 1832):先删掉外键,两侧都转换完再加回。"
      zh-TW: "涉及外鍵:MySQL 8.0+ 在 foreign_key_checks = 1 時不允許只改一側的字元集(錯誤 3780)。在同一個工作階段裡先 SET foreign_key_checks = 0,兩側一起改完再設回 1。MariaDB 即使這樣也不讓改外鍵裡的欄位(錯誤 1832):先刪掉外鍵,兩側都轉換完再加回。"
    fix_check:
      en: "Type, NULL, default and comment come from information_schema: compare with SHOW CREATE TABLE before running."
      zh-CN: "类型、NULL、默认值与注释取自 information_schema,执行前请与 SHOW CREATE TABLE 对照。"
      zh-TW: "型別、NULL、預設值與註解取自 information_schema,執行前請與 SHOW CREATE TABLE 對照。"
    fix_manual:
      en: "%{col} is a generated column or has a default expression / ON UPDATE, so its definition can't be rebuilt here: write ALTER TABLE … MODIFY from SHOW CREATE TABLE with CHARACTER SET %{cs} COLLATE %{coll}."
      zh-CN: "%{col} 是生成列或带表达式默认值 / ON UPDATE,这里拼不全定义:请照 SHOW CREATE TABLE 手写 ALTER TABLE … MODIFY,加上 CHARACTER SET %{cs} COLLATE %{coll}。"
      zh-TW: "%{col} 是產生欄位或帶運算式預設值 / ON UPDATE,這裡拼不全定義:請照 SHOW CREATE TABLE 手寫 ALTER TABLE … MODIFY,加上 CHARACTER SET %{cs} COLLATE %{coll}。"
    what_charset:
      en: "character sets"
      zh-CN: "字符集"
      zh-TW: "字元集"
    what_collation:
      en: "collations"
      zh-CN: "排序规则"
      zh-TW: "定序"
    pair_note:
      en: "The two sides use different %{what}: comparing them converts one side implicitly, so its index can't be used (or the query fails with “Illegal mix of collations”). Make both sides the same."
      zh-CN: "两侧%{what}不同:比较时要隐式转换其中一侧,那一侧的索引用不上(或报 “Illegal mix of collations”)。把两侧改成一致。"
      zh-TW: "兩側%{what}不同:比較時要隱式轉換其中一側,那一側的索引用不上(或報 “Illegal mix of collations”)。把兩側改成一致。"
    why_fk:
      en: "Foreign key %{name}."
      zh-CN: "外键 %{name}。"
      zh-TW: "外鍵 %{name}。"
    why_naming:
      en: "Likely join: %{col} → %{table}.id (by naming)."
      zh-CN: "常见 JOIN:%{col} → %{table}.id(按命名推断)。"
      zh-TW: "常見 JOIN:%{col} → %{table}.id(依命名推斷)。"
    why_same_name:
      en: "Likely join: same column name as the key %{table}.%{col}."
      zh-CN: "常见 JOIN:与 %{table}.%{col}(主键 / 唯一键)同名。"
      zh-TW: "常見 JOIN:與 %{table}.%{col}(主鍵 / 唯一鍵)同名。"
    modern:
      en: "%{alt} is also available (newer Unicode rules, faster), but it sorts and compares differently from %{from} and counts trailing spaces: check unique keys before choosing it."
      zh-CN: "也可选 %{alt}(Unicode 规则更新、更快),但排序和比较结果与 %{from} 不同,且尾部空格参与比较:选用前先确认唯一键不会冲突。"
      zh-TW: "也可選 %{alt}(Unicode 規則較新、較快),但排序和比較結果與 %{from} 不同,且尾端空白參與比較:選用前先確認唯一鍵不會衝突。"
    note_schema:
      en: "Database default is utf8mb3: tables created without an explicit charset can't store 4-byte characters such as emoji."
      zh-CN: "库默认字符集是 utf8mb3:没写字符集的新表存不了 emoji 等 4 字节字符。"
      zh-TW: "資料庫預設字元集是 utf8mb3:沒寫字元集的新表存不了 emoji 等 4 位元組字元。"
    note_table:
      en: "Table default is utf8mb3 (at most 3 bytes per character): emoji and some rare CJK characters fail to save or get cut off."
      zh-CN: "表默认字符集是 utf8mb3(每字符最多 3 字节):emoji 和部分生僻汉字存不进去或被截断。"
      zh-TW: "資料表預設字元集是 utf8mb3(每字元最多 3 位元組):emoji 與部分罕用漢字存不進去或被截斷。"
    note_column:
      en: "%{ty} in utf8mb3 can't store 4-byte characters. Converted together with its table (ALTER TABLE … CONVERT TO CHARACTER SET utf8mb4)."
      zh-CN: "utf8mb3 的 %{ty} 存不了 4 字节字符。随所在表一起转换(ALTER TABLE … CONVERT TO CHARACTER SET utf8mb4)。"
      zh-TW: "utf8mb3 的 %{ty} 存不了 4 位元組字元。隨所在資料表一起轉換(ALTER TABLE … CONVERT TO CHARACTER SET utf8mb4)。"
    note_column_collation:
      en: "Differs from the table default %{coll}. Fine if intentional (e.g. a _bin column for case-sensitive matching); otherwise joins and comparisons with other columns may need COLLATE and miss the index."
      zh-CN: "与表默认规则 %{coll} 不同。刻意为之(如区分大小写的 _bin 列)可以忽略;否则与其他列比较 / JOIN 时可能要 COLLATE、用不上索引。"
      zh-TW: "與資料表預設定序 %{coll} 不同。刻意為之(如區分大小寫的 _bin 欄位)可以忽略;否則與其他欄位比較 / JOIN 時可能要 COLLATE、用不上索引。"
    note_table_collation:
      en: "Differs from the database default %{coll}. Harmless by itself, but tables created later use the database default, and joins across the two may mix collations."
      zh-CN: "与库默认规则 %{coll} 不同。本身无害,但之后新建的表会用库默认规则,两边的表 JOIN 时可能混用排序规则。"
      zh-TW: "與資料庫預設定序 %{coll} 不同。本身無害,但之後新建的表會用資料庫預設定序,兩邊的表 JOIN 時可能混用定序。"
    columns_truncated:
      en: "Too many columns: only the first %{n} were checked."
      zh-CN: "列太多:只检查了前 %{n} 列。"
      zh-TW: "欄位太多:只檢查了前 %{n} 欄。"
    findings_truncated:
      en: "Not shown: %{n} more findings (the full script still covers every table)."
      zh-CN: "还有 %{n} 条未显示(完整脚本里仍包含全部表)。"
      zh-TW: "還有 %{n} 條未顯示(完整腳本裡仍包含全部資料表)。"
