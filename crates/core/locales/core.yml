_version: 2
core:
  err:
    xlsx_too_many_rows:
      en: "Too many rows for one Excel sheet (max %{max})"
      zh-CN: "行数超过 Excel 单个工作表的上限(%{max} 行)"
      zh-TW: "列數超過 Excel 單一工作表的上限(%{max} 列)"
    connection_not_found:
      en: Connection not found
      zh-CN: 连接不存在
      zh-TW: 找不到此連線
    unsupported_kind:
      en: Unsupported connection type
      zh-CN: 不支持的连接类型
      zh-TW: 不支援的連線類型
    redis_unsupported:
      en: This operation is not supported for Redis
      zh-CN: Redis 不支持该操作
      zh-TW: Redis 不支援此操作
    mongo_unsupported:
      en: This operation is not supported for MongoDB
      zh-CN: MongoDB 不支持该操作
      zh-TW: MongoDB 不支援此操作
    not_connected:
      en: Not connected. Please connect first
      zh-CN: 连接未建立,请先连接
      zh-TW: 尚未建立連線,請先連線
    connect_failed:
      en: "Failed to connect to %{db}"
      zh-CN: "连接 %{db} 失败"
      zh-TW: "連線至 %{db} 失敗"
    query_failed:
      en: Query failed
      zh-CN: 查询失败
      zh-TW: 查詢失敗
    exec_failed:
      en: Execution failed
      zh-CN: 执行失败
      zh-TW: 執行失敗
    read_result_failed:
      en: Failed to read results
      zh-CN: 读取结果失败
      zh-TW: 讀取結果失敗
    update_failed:
      en: Update failed
      zh-CN: 更新失败
      zh-TW: 更新失敗
    delete_failed:
      en: Delete failed
      zh-CN: 删除失败
      zh-TW: 刪除失敗
    begin_tx_failed:
      en: Failed to begin transaction
      zh-CN: 开启事务失败
      zh-TW: 開始交易失敗
    commit_tx_failed:
      en: Failed to commit transaction
      zh-CN: 提交事务失败
      zh-TW: 認可交易失敗
    stmt_failed_rolled_back:
      en: "Statement %{n} failed; rolled back"
      zh-CN: "第 %{n} 条语句执行失败,已回滚"
      zh-TW: "第 %{n} 條陳述式執行失敗,已回復"
    stmt_failed_all_rolled_back:
      en: "Statement %{n} failed; all changes rolled back"
      zh-CN: "第 %{n} 条语句执行失败,已整体回滚"
      zh-TW: "第 %{n} 條陳述式執行失敗,已全部回復"
    read_column_type_failed:
      en: Failed to read column type
      zh-CN: 读取列类型失败
      zh-TW: 讀取欄位類型失敗
    column_not_found:
      en: "Column %{table}.%{column} does not exist"
      zh-CN: "列 %{table}.%{column} 不存在"
      zh-TW: "欄位 %{table}.%{column} 不存在"
    redis_command_failed:
      en: Redis command failed
      zh-CN: Redis 命令失败
      zh-TW: Redis 指令失敗
    connect_timeout:
      en: "Timed out: the server did not respond to the handshake (check that the SSL mode matches the server)"
      zh-CN: 连接超时:服务器未响应握手(请检查 SSL 模式是否与服务器一致)
      zh-TW: 連線逾時:伺服器未回應交握(請檢查 SSL 模式是否與伺服器一致)
    ssh_connect_failed:
      en: Could not connect to the SSH server
      zh-CN: 无法连接 SSH 跳板机
      zh-TW: 無法連線 SSH 跳板機
    ssh_timeout:
      en: "Timed out: the SSH server did not respond within 10 seconds"
      zh-CN: 连接超时:SSH 跳板机 10 秒内没有响应
      zh-TW: 連線逾時:SSH 跳板機 10 秒內沒有回應
    ssh_auth_failed:
      en: "SSH authentication failed: check the user, password or key"
      zh-CN: SSH 认证失败:请检查用户名、密码或私钥
      zh-TW: SSH 認證失敗:請檢查使用者名稱、密碼或私鑰
    ssh_host_key_changed:
      en: "The SSH server's host key has changed and does not match the recorded one. This may be a man-in-the-middle attack; if the server was reinstalled, remove the old entry from known_hosts"
      zh-CN: SSH 跳板机的主机指纹与记录不一致,可能遭到中间人攻击;若服务器确实重装过,请从 known_hosts 删除旧记录
      zh-TW: SSH 跳板機的主機指紋與記錄不一致,可能遭到中間人攻擊;若伺服器確實重灌過,請從 known_hosts 刪除舊記錄
    ssh_host_key_revoked:
      en: "The SSH server presented a host key that is marked @revoked in known_hosts"
      zh-CN: SSH 跳板机出示的主机密钥已在 known_hosts 中标记为吊销(@revoked)
      zh-TW: SSH 跳板機出示的主機金鑰已在 known_hosts 中標記為撤銷(@revoked)
    ssh_host_key_other_type:
      en: "known_hosts records a %{recorded} key for this SSH server, but it presented a %{offered} key, so its identity cannot be confirmed. If this is expected, check the key with ssh-keyscan and add it to known_hosts"
      zh-CN: known_hosts 中记录的是这台跳板机的 %{recorded} 密钥,它这次出示的是 %{offered} 密钥,无法确认身份。若确认正常,请用 ssh-keyscan 核对后把该密钥加入 known_hosts
      zh-TW: known_hosts 中記錄的是這台跳板機的 %{recorded} 金鑰,它這次出示的是 %{offered} 金鑰,無法確認身分。若確認正常,請用 ssh-keyscan 核對後把該金鑰加入 known_hosts
    ssh_known_hosts_unreadable:
      en: "Could not verify the SSH server's host key: its known_hosts entry could not be read or recorded"
      zh-CN: 无法确认 SSH 跳板机的主机指纹:known_hosts 中的记录读取或写入失败
      zh-TW: 無法確認 SSH 跳板機的主機指紋:known_hosts 中的記錄讀取或寫入失敗
    ssh_key_not_found:
      en: "SSH private key not found (with no path given, ~/.ssh/id_ed25519, id_ecdsa and id_rsa are tried)"
      zh-CN: 找不到 SSH 私钥(未填路径时依次查找 ~/.ssh/id_ed25519、id_ecdsa、id_rsa)
      zh-TW: 找不到 SSH 私鑰(未填路徑時依序尋找 ~/.ssh/id_ed25519、id_ecdsa、id_rsa)
    ssh_key_encrypted:
      en: "The SSH private key is protected by a passphrase: enter it in the passphrase field"
      zh-CN: SSH 私钥有密码短语保护,请填写密码短语
      zh-TW: SSH 私鑰有密碼短語保護,請填寫密碼短語
    ssh_key_invalid:
      en: "Could not read the SSH private key (wrong passphrase or unsupported format)"
      zh-CN: 无法读取 SSH 私钥(密码短语错误或格式不支持)
      zh-TW: 無法讀取 SSH 私鑰(密碼短語錯誤或格式不支援)
    ssh_rsa_unsupported:
      en: "RSA SSH keys are not supported yet: use an ed25519 or ecdsa key (ssh-keygen -t ed25519)"
      zh-CN: 暂不支持 RSA 类型的 SSH 私钥,请改用 ed25519 或 ecdsa 私钥(ssh-keygen -t ed25519)
      zh-TW: 暫不支援 RSA 類型的 SSH 私鑰,請改用 ed25519 或 ecdsa 私鑰(ssh-keygen -t ed25519)
    ssh_agent_unavailable:
      en: Could not reach the SSH agent
      zh-CN: 无法连接 ssh-agent
      zh-TW: 無法連線 ssh-agent
    ssh_forward_failed:
      en: "The SSH server could not reach the database (check the database host and port as seen from the SSH server)"
      zh-CN: 跳板机连不到数据库(主机和端口要填跳板机视角下的地址)
      zh-TW: 跳板機連不到資料庫(主機與連接埠要填跳板機視角下的位址)
    impact_timeout:
      en: "Counting took longer than %{secs} seconds and was stopped"
      zh-CN: 统计超过 %{secs} 秒,已中止
      zh-TW: 統計超過 %{secs} 秒,已中止
    diag_unknown:
      en: "Unknown diagnostics section: %{key}"
      zh-CN: 未知的诊断项:%{key}
      zh-TW: 未知的診斷項:%{key}
    diag_bad_arg:
      en: Invalid target for this action
      zh-CN: 操作目标无效
      zh-TW: 操作目標無效
    diag_signal_failed:
      en: The session has already ended, or you lack permission to signal it
      zh-CN: 会话已结束,或没有权限操作该会话
      zh-TW: 工作階段已結束,或沒有權限操作該工作階段
    analyze_read_only:
      en: EXPLAIN ANALYZE runs the statement, so it is only offered for read-only statements
      zh-CN: EXPLAIN ANALYZE 会真正执行语句,只对只读语句开放
      zh-TW: EXPLAIN ANALYZE 會真正執行語句,只對唯讀語句開放
    analyze_unsupported:
      en: This database does not support EXPLAIN ANALYZE
      zh-CN: 这个数据库不支持 EXPLAIN ANALYZE
      zh-TW: 這個資料庫不支援 EXPLAIN ANALYZE
    invalid_redis_url:
      en: Invalid Redis connection string
      zh-CN: 无效的 Redis 连接串
      zh-TW: 無效的 Redis 連線字串
    sqlite_path_missing:
      en: No SQLite file path specified
      zh-CN: 未指定 SQLite 文件路径
      zh-TW: 未指定 SQLite 檔案路徑
    sqlite_file_not_found:
      en: SQLite file does not exist
      zh-CN: SQLite 文件不存在
      zh-TW: SQLite 檔案不存在
    sqlite_open_failed:
      en: Failed to open SQLite database
      zh-CN: 打开 SQLite 数据库失败
      zh-TW: 開啟 SQLite 資料庫失敗
    keychain_password_not_found:
      en: Password for this connection not found in Keychain
      zh-CN: 钥匙串中未找到该连接的密码
      zh-TW: 鑰匙圈中找不到此連線的密碼
    keychain_write_failed:
      en: Failed to write to Keychain
      zh-CN: 写入钥匙串失败
      zh-TW: 寫入鑰匙圈失敗
    keychain_read_failed:
      en: Failed to read from Keychain
      zh-CN: 读取钥匙串失败
      zh-TW: 讀取鑰匙圈失敗
    keychain_delete_failed:
      en: Failed to delete Keychain item
      zh-CN: 删除钥匙串项失败
      zh-TW: 刪除鑰匙圈項目失敗
    create_config_dir_failed:
      en: Failed to create config directory
      zh-CN: 创建配置目录失败
      zh-TW: 建立設定目錄失敗
    read_config_failed:
      en: Failed to read config
      zh-CN: 读取配置失败
      zh-TW: 讀取設定失敗
    parse_config_failed:
      en: Failed to parse config
      zh-CN: 解析配置失败
      zh-TW: 解析設定失敗
    serialize_config_failed:
      en: Failed to serialize config
      zh-CN: 序列化配置失败
      zh-TW: 序列化設定失敗
    write_config_failed:
      en: Failed to write config
      zh-CN: 写入配置失败
      zh-TW: 寫入設定失敗
    serialize_history_failed:
      en: Failed to serialize history
      zh-CN: 序列化历史失败
      zh-TW: 序列化歷史記錄失敗
    write_history_failed:
      en: Failed to write history
      zh-CN: 写入历史失败
      zh-TW: 寫入歷史記錄失敗
    set_permissions_failed:
      en: Failed to set file permissions
      zh-CN: 设置文件权限失败
      zh-TW: 設定檔案權限失敗
    read_file_failed:
      en: "Failed to read file: %{error}"
      zh-CN: "读取文件失败: %{error}"
      zh-TW: "讀取檔案失敗: %{error}"
    read_file_utf8_failed:
      en: "Failed to read file (must be UTF-8 text): %{error}"
      zh-CN: "读取文件失败(需为 UTF-8 文本): %{error}"
      zh-TW: "讀取檔案失敗(須為 UTF-8 文字): %{error}"
    file_too_large:
      en: "File too large (%{size} MB); import limit is %{limit} MB"
      zh-CN: "文件过大(%{size} MB),导入上限 %{limit} MB"
      zh-TW: "檔案過大(%{size} MB),匯入上限為 %{limit} MB"
  export:
    table_rows:
      en: "-- %{table} (%{count} rows)"
      zh-CN: "-- %{table} (%{count} 行)"
      zh-TW: "-- %{table} (%{count} 列)"
    table_failed:
      en: "-- %{table}: export failed · %{error}"
      zh-CN: "-- %{table}: 导出失败 · %{error}"
      zh-TW: "-- %{table}: 匯出失敗 · %{error}"
  filter:
    contains:
      en: Contains
      zh-CN: 包含
      zh-TW: 包含
    eq:
      en: Equals
      zh-CN: 等于
      zh-TW: 等於
    ne:
      en: Not Equal
      zh-CN: 不等于
      zh-TW: 不等於
    starts:
      en: Starts With
      zh-CN: 开头是
      zh-TW: 開頭是
    ends:
      en: Ends With
      zh-CN: 结尾是
      zh-TW: 結尾是
    gt:
      en: Greater Than
      zh-CN: 大于
      zh-TW: 大於
    lt:
      en: Less Than
      zh-CN: 小于
      zh-TW: 小於
    gte:
      en: At Least
      zh-CN: 大于等于
      zh-TW: 大於等於
    lte:
      en: At Most
      zh-CN: 小于等于
      zh-TW: 小於等於
    empty:
      en: Is Empty
      zh-CN: 为空
      zh-TW: 為空
    not_empty:
      en: Is Not Empty
      zh-CN: 非空
      zh-TW: 非空
    and:
      en: And
      zh-CN: 且
      zh-TW: 且
    or:
      en: Or
      zh-CN: 或
      zh-TW: 或
  diff:
    view:
      en: "View"
      zh-CN: "视图"
      zh-TW: "檢視"
    view_added:
      en: "View only in the source"
      zh-CN: "只在源库有的视图"
      zh-TW: "只在來源庫有的檢視"
    view_removed:
      en: "View only in the target"
      zh-CN: "只在目标库有的视图"
      zh-TW: "只在目標庫有的檢視"
    view_changed:
      en: "View definition differs"
      zh-CN: "视图定义不同"
      zh-TW: "檢視定義不同"
    trigger:
      en: "Trigger"
      zh-CN: "触发器"
      zh-TW: "觸發器"
    trigger_added:
      en: "Trigger only in the source"
      zh-CN: "只在源库有的触发器"
      zh-TW: "只在來源庫有的觸發器"
    trigger_removed:
      en: "Trigger only in the target"
      zh-CN: "只在目标库有的触发器"
      zh-TW: "只在目標庫有的觸發器"
    trigger_changed:
      en: "Trigger definition differs"
      zh-CN: "触发器定义不同"
      zh-TW: "觸發器定義不同"
    trigger_manual:
      en: "The trigger body has several statements (BEGIN … END), so it is commented out; run it by hand in a client that supports DELIMITER"
      zh-CN: "触发器体里有多条语句(BEGIN … END),已注释;请在支持 DELIMITER 的客户端里手动执行"
      zh-TW: "觸發器本體有多條語句(BEGIN … END),已註解;請在支援 DELIMITER 的用戶端手動執行"
    col_comment:
      en: "Column %{col} comment: %{from} → %{to}"
      zh-CN: "列 %{col} 的注释:%{from} → %{to}"
      zh-TW: "欄位 %{col} 的註解:%{from} → %{to}"
    table_comment:
      en: "Table comment: %{from} → %{to}"
      zh-CN: "表注释:%{from} → %{to}"
      zh-TW: "資料表註解:%{from} → %{to}"
    fk_added:
      en: "Foreign key added %{fk}"
      zh-CN: "新增外键 %{fk}"
      zh-TW: "新增外鍵 %{fk}"
    fk_removed:
      en: "Foreign key only in the target %{fk}"
      zh-CN: "只在目标库有的外键 %{fk}"
      zh-TW: "只在目標庫有的外鍵 %{fk}"
    sqlite_fk:
      en: "SQLite can't add or drop foreign keys on an existing table; rebuild %{table} to change them"
      zh-CN: "SQLite 不能给已有的表增删外键,需要重建 %{table} 才能修改"
      zh-TW: "SQLite 無法為既有資料表增刪外鍵,需要重建 %{table} 才能修改"
    new_fks:
      en: "Foreign keys of the new tables (added last, after every table exists)"
      zh-CN: "新表的外键(放在最后,等所有表都建好再加)"
      zh-TW: "新資料表的外鍵(放在最後,等所有資料表都建好再加)"
    suspicious:
      en: "The definition below contains unusual characters, so it is commented out; check it by hand"
      zh-CN: "下面这条的定义里有异常字符,已注释,请手工检查"
      zh-TW: "下面這條的定義裡有異常字元,已註解,請手動檢查"
    table_added:
      en: "Only in the source: created by the script"
      zh-CN: "只在源库:脚本会建表"
      zh-TW: "只在來源庫:腳本會建表"
    table_removed:
      en: "Only in the target (drop is commented out)"
      zh-CN: "只在目标库(删表语句已注释)"
      zh-TW: "只在目標庫(刪表語句已註解)"
    col_added:
      en: "Column %{col} added: %{def}"
      zh-CN: "新增列 %{col}:%{def}"
      zh-TW: "新增欄位 %{col}:%{def}"
    col_removed:
      en: "Column %{col} only in the target (drop is commented out)"
      zh-CN: "列 %{col} 只在目标库(删列语句已注释)"
      zh-TW: "欄位 %{col} 只在目標庫(刪欄語句已註解)"
    col_type:
      en: "Column %{col} type: %{from} → %{to}"
      zh-CN: "列 %{col} 类型:%{from} → %{to}"
      zh-TW: "欄位 %{col} 類型:%{from} → %{to}"
    col_null:
      en: "Column %{col} becomes %{to}"
      zh-CN: "列 %{col} 改为 %{to}"
      zh-TW: "欄位 %{col} 改為 %{to}"
    col_default:
      en: "Column %{col} default: %{from} → %{to}"
      zh-CN: "列 %{col} 默认值:%{from} → %{to}"
      zh-TW: "欄位 %{col} 預設值:%{from} → %{to}"
    pk_changed:
      en: "Primary key: (%{from}) → (%{to})"
      zh-CN: "主键:(%{from}) → (%{to})"
      zh-TW: "主鍵:(%{from}) → (%{to})"
    pk_manual:
      en: "%{table}: the primary key differs; change it by hand"
      zh-CN: "%{table}:主键不同,请手工调整"
      zh-TW: "%{table}:主鍵不同,請手動調整"
    idx_added:
      en: "Index %{name} added (%{cols})"
      zh-CN: "新增索引 %{name}(%{cols})"
      zh-TW: "新增索引 %{name}(%{cols})"
    idx_removed:
      en: "Index %{name} only in the target (drop is commented out)"
      zh-CN: "索引 %{name} 只在目标库(删索引语句已注释)"
      zh-TW: "索引 %{name} 只在目標庫(刪索引語句已註解)"
    idx_changed:
      en: "Index %{name} differs: recreated"
      zh-CN: "索引 %{name} 定义不同:重建"
      zh-TW: "索引 %{name} 定義不同:重建"
    sqlite_rebuild:
      en: "SQLite cannot change a column definition: rebuild %{table} by hand to change %{col}"
      zh-CN: "SQLite 不支持修改列定义:要改 %{col},需手工重建表 %{table}"
      zh-TW: "SQLite 不支援修改欄位定義:要改 %{col},需手動重建表 %{table}"
    sqlite_not_null:
      en: "SQLite cannot add a NOT NULL column without a default to %{table} (%{col})"
      zh-CN: "SQLite 不能给 %{table} 添加没有默认值的 NOT NULL 列(%{col})"
      zh-TW: "SQLite 不能為 %{table} 新增沒有預設值的 NOT NULL 欄位(%{col})"
    no_ddl:
      en: "Could not read the CREATE statement of %{table}"
      zh-CN: "读不到 %{table} 的建表语句"
      zh-TW: "讀不到 %{table} 的建表語句"
    identical:
      en: "The two schemas are identical"
      zh-CN: "两个库的结构一致"
      zh-TW: "兩個庫的結構一致"
    header:
      en: "Migration: makes the target match the source. Statements that drop anything are commented out; uncomment them after checking."
      zh-CN: "迁移脚本:让目标库与源库一致。删除类语句已注释,确认后再取消注释。"
      zh-TW: "遷移腳本:讓目標庫與來源庫一致。刪除類語句已註解,確認後再取消註解。"
  completion:
    table:
      en: Table
      zh-CN: 表
      zh-TW: 資料表
    keyword:
      en: Keyword
      zh-CN: 关键字
      zh-TW: 關鍵字
    select_all:
      en: Select all columns
      zh-CN: 查询全部列
      zh-TW: 查詢所有欄位
    insert_row:
      en: Insert a row
      zh-CN: 插入一行
      zh-TW: 插入一列
    update_rows:
