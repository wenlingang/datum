_version: 2
core:
  err:
    ssh_proxy_jump_invalid:
      en: "Can't read the jump hosts (ProxyJump); write them as [user@]host[:port], separated by commas"
      zh-CN: "看不懂跳板设置(ProxyJump);写法是 [用户@]主机[:端口],多个用逗号隔开"
      zh-TW: "看不懂跳板設定(ProxyJump);寫法是 [使用者@]主機[:埠],多個用逗號隔開"
    ssh_jump_auth_failed:
      en: "Couldn't log in to the jump host. Intermediate jump hosts use ssh-agent or a private key (IdentityFile in ~/.ssh/config, or the default keys in ~/.ssh); passwords aren't sent to them"
      zh-CN: "登录不了中间的跳板。中间跳板用 ssh-agent 或私钥认证(~/.ssh/config 里的 IdentityFile,或 ~/.ssh 下的默认私钥),不会发送密码"
      zh-TW: "登入不了中間的跳板。中間跳板用 ssh-agent 或私鑰認證(~/.ssh/config 裡的 IdentityFile,或 ~/.ssh 下的預設私鑰),不會傳送密碼"
    redis_cluster_tunnel:
      en: "Connected through an SSH tunnel, which only reaches the current node"
      zh-CN: "经 SSH 隧道连接,隧道只通当前节点"
      zh-TW: "經 SSH 通道連線,通道只通到目前節點"
    redis_live_ended:
      en: "This live session has ended"
      zh-CN: "实时会话已结束"
      zh-TW: "即時工作階段已結束"
    redis_live_too_many:
      en: "Too many live sessions are open (max %{max}); close some Redis Live tabs first"
      zh-CN: "打开的实时会话太多(最多 %{max} 个),请先关掉一些 Redis 实时标签页"
      zh-TW: "開啟的即時工作階段太多(最多 %{max} 個),請先關掉一些 Redis 即時分頁"
    redis_live_too_many_subs:
      en: "Subscribe to at most %{max} channels and patterns in one session"
      zh-CN: "一个会话最多订阅 %{max} 个频道和模式"
      zh-TW: "一個工作階段最多訂閱 %{max} 個頻道和模式"
    redis_live_bad_channel:
      en: "Channel or pattern can't be empty or longer than 1024 bytes"
      zh-CN: "频道或模式不能为空,也不能超过 1024 字节"
      zh-TW: "頻道或模式不能為空,也不能超過 1024 位元組"
    xlsx_too_many_rows:
      en: "Too many rows for one Excel sheet (max %{max})"
      zh-CN: "行数超过 Excel 单个工作表的上限(%{max} 行)"
      zh-TW: "列數超過 Excel 單一工作表的上限(%{max} 列)"
    connection_not_found:
      en: Connection not found
      zh-CN: 连接不存在
      zh-TW: 找不到此連線
    unsupported_kind:
      en: Unsupported connection type
      zh-CN: 不支持的连接类型
      zh-TW: 不支援的連線類型
    redis_unsupported:
      en: This operation is not supported for Redis
      zh-CN: Redis 不支持该操作
      zh-TW: Redis 不支援此操作
    mongo_unsupported:
      en: This operation is not supported for MongoDB
      zh-CN: MongoDB 不支持该操作
      zh-TW: MongoDB 不支援此操作
    not_connected:
      en: Not connected. Please connect first
      zh-CN: 连接未建立,请先连接
      zh-TW: 尚未建立連線,請先連線
    connect_failed:
      en: "Failed to connect to %{db}"
      zh-CN: "连接 %{db} 失败"
      zh-TW: "連線至 %{db} 失敗"
    query_failed:
      en: Query failed
      zh-CN: 查询失败
      zh-TW: 查詢失敗
    exec_failed:
      en: Execution failed
      zh-CN: 执行失败
      zh-TW: 執行失敗
    read_result_failed:
      en: Failed to read results
      zh-CN: 读取结果失败
      zh-TW: 讀取結果失敗
    update_failed:
      en: Update failed
      zh-CN: 更新失败
      zh-TW: 更新失敗
    delete_failed:
      en: Delete failed
      zh-CN: 删除失败
      zh-TW: 刪除失敗
    begin_tx_failed:
      en: Failed to begin transaction
      zh-CN: 开启事务失败
      zh-TW: 開始交易失敗
    commit_tx_failed:
      en: Failed to commit transaction
      zh-CN: 提交事务失败
      zh-TW: 認可交易失敗
    stmt_failed_rolled_back:
      en: "Statement %{n} failed; rolled back"
      zh-CN: "第 %{n} 条语句执行失败,已回滚"
      zh-TW: "第 %{n} 條陳述式執行失敗,已回復"
    stmt_failed_all_rolled_back:
      en: "Statement %{n} failed; all changes rolled back"
      zh-CN: "第 %{n} 条语句执行失败,已整体回滚"
      zh-TW: "第 %{n} 條陳述式執行失敗,已全部回復"
    read_column_type_failed:
      en: Failed to read column type
      zh-CN: 读取列类型失败
      zh-TW: 讀取欄位類型失敗
    column_not_found:
      en: "Column %{table}.%{column} does not exist"
      zh-CN: "列 %{table}.%{column} 不存在"
      zh-TW: "欄位 %{table}.%{column} 不存在"
    redis_key_gone:
      en: "Key %{key} no longer exists"
      zh-CN: "key %{key} 已不存在"
      zh-TW: "key %{key} 已不存在"
    redis_type_changed:
      en: "Key %{key} is now a %{actual}, not a %{expected}; refresh and try again"
      zh-CN: "key %{key} 现在是 %{actual},不是 %{expected};刷新后再试"
      zh-TW: "key %{key} 現在是 %{actual},不是 %{expected};重新整理後再試"
    redis_field_exists:
      en: "Field %{name} already exists"
      zh-CN: "字段 %{name} 已存在"
      zh-TW: "欄位 %{name} 已存在"
    redis_member_exists:
      en: "Member %{name} already exists"
      zh-CN: "成员 %{name} 已存在"
      zh-TW: "成員 %{name} 已存在"
    redis_key_exists:
      en: "Key %{key} already exists"
      zh-CN: "key %{key} 已存在"
      zh-TW: "key %{key} 已存在"
    redis_list_changed:
      en: "The list has changed: index %{index} no longer holds the value shown. Refresh and try again"
      zh-CN: "列表已被改动:下标 %{index} 处已不是显示的值。刷新后再试"
      zh-TW: "清單已被變動:索引 %{index} 處已不是顯示的值。重新整理後再試"
    redis_bad_score:
      en: "Score must be a number (inf / -inf allowed): %{score}"
      zh-CN: "分数须为数字(可用 inf / -inf):%{score}"
      zh-TW: "分數須為數字(可用 inf / -inf):%{score}"
    redis_bad_ttl:
      en: TTL must be a positive number of seconds
      zh-CN: TTL 须为正整数秒
      zh-TW: TTL 須為正整數秒
    redis_empty_key:
      en: Key name can't be empty
      zh-CN: key 名不能为空
      zh-TW: key 名稱不能為空
    redis_no_items:
      en: Enter at least one element
      zh-CN: 至少填写一个元素
      zh-TW: 至少填寫一個元素
    redis_bad_type:
      en: "Unsupported key type: %{kind}"
      zh-CN: "不支持的 key 类型:%{kind}"
      zh-TW: "不支援的 key 類型:%{kind}"
    redis_command_failed:
      en: Redis command failed
      zh-CN: Redis 命令失败
      zh-TW: Redis 指令失敗
    connect_timeout:
      en: "Timed out: the server did not respond to the handshake (check that the SSL mode matches the server)"
      zh-CN: 连接超时:服务器未响应握手(请检查 SSL 模式是否与服务器一致)
      zh-TW: 連線逾時:伺服器未回應交握(請檢查 SSL 模式是否與伺服器一致)
    ssh_connect_failed:
      en: Could not connect to the SSH server
      zh-CN: 无法连接 SSH 跳板机
      zh-TW: 無法連線 SSH 跳板機
    ssh_timeout:
      en: "Timed out: the SSH server did not respond within 10 seconds"
      zh-CN: 连接超时:SSH 跳板机 10 秒内没有响应
      zh-TW: 連線逾時:SSH 跳板機 10 秒內沒有回應
    ssh_auth_failed:
      en: "SSH authentication failed: check the user, password or key"
      zh-CN: SSH 认证失败:请检查用户名、密码或私钥
      zh-TW: SSH 認證失敗:請檢查使用者名稱、密碼或私鑰
    ssh_host_key_changed:
      en: "The SSH server's host key has changed and does not match the recorded one. This may be a man-in-the-middle attack; if the server was reinstalled, remove the old entry from known_hosts"
      zh-CN: SSH 跳板机的主机指纹与记录不一致,可能遭到中间人攻击;若服务器确实重装过,请从 known_hosts 删除旧记录
      zh-TW: SSH 跳板機的主機指紋與記錄不一致,可能遭到中間人攻擊;若伺服器確實重灌過,請從 known_hosts 刪除舊記錄
    ssh_host_key_revoked:
      en: "The SSH server presented a host key that is marked @revoked in known_hosts"
      zh-CN: SSH 跳板机出示的主机密钥已在 known_hosts 中标记为吊销(@revoked)
      zh-TW: SSH 跳板機出示的主機金鑰已在 known_hosts 中標記為撤銷(@revoked)
    ssh_host_key_other_type:
      en: "known_hosts records a %{recorded} key for this SSH server, but it presented a %{offered} key, so its identity cannot be confirmed. If this is expected, check the key with ssh-keyscan and add it to known_hosts"
      zh-CN: known_hosts 中记录的是这台跳板机的 %{recorded} 密钥,它这次出示的是 %{offered} 密钥,无法确认身份。若确认正常,请用 ssh-keyscan 核对后把该密钥加入 known_hosts
      zh-TW: known_hosts 中記錄的是這台跳板機的 %{recorded} 金鑰,它這次出示的是 %{offered} 金鑰,無法確認身分。若確認正常,請用 ssh-keyscan 核對後把該金鑰加入 known_hosts
    ssh_known_hosts_unreadable:
      en: "Could not verify the SSH server's host key: its known_hosts entry could not be read or recorded"
      zh-CN: 无法确认 SSH 跳板机的主机指纹:known_hosts 中的记录读取或写入失败
      zh-TW: 無法確認 SSH 跳板機的主機指紋:known_hosts 中的記錄讀取或寫入失敗
    ssh_key_not_found:
      en: "SSH private key not found (with no path given, ~/.ssh/id_ed25519, id_ecdsa and id_rsa are tried)"
      zh-CN: 找不到 SSH 私钥(未填路径时依次查找 ~/.ssh/id_ed25519、id_ecdsa、id_rsa)
      zh-TW: 找不到 SSH 私鑰(未填路徑時依序尋找 ~/.ssh/id_ed25519、id_ecdsa、id_rsa)
    ssh_key_encrypted:
      en: "The SSH private key is protected by a passphrase: enter it in the passphrase field"
      zh-CN: SSH 私钥有密码短语保护,请填写密码短语
      zh-TW: SSH 私鑰有密碼短語保護,請填寫密碼短語
    ssh_key_invalid:
      en: "Could not read the SSH private key (wrong passphrase or unsupported format)"
      zh-CN: 无法读取 SSH 私钥(密码短语错误或格式不支持)
      zh-TW: 無法讀取 SSH 私鑰(密碼短語錯誤或格式不支援)
    ssh_rsa_unsupported:
      en: "RSA SSH keys are not supported yet: use an ed25519 or ecdsa key (ssh-keygen -t ed25519)"
      zh-CN: 暂不支持 RSA 类型的 SSH 私钥,请改用 ed25519 或 ecdsa 私钥(ssh-keygen -t ed25519)
      zh-TW: 暫不支援 RSA 類型的 SSH 私鑰,請改用 ed25519 或 ecdsa 私鑰(ssh-keygen -t ed25519)
    ssh_agent_unavailable:
      en: Could not reach the SSH agent
      zh-CN: 无法连接 ssh-agent
      zh-TW: 無法連線 ssh-agent
    ssh_forward_failed:
      en: "The SSH server could not reach the database (check the database host and port as seen from the SSH server)"
      zh-CN: 跳板机连不到数据库(主机和端口要填跳板机视角下的地址)
      zh-TW: 跳板機連不到資料庫(主機與連接埠要填跳板機視角下的位址)
    impact_timeout:
      en: "Counting took longer than %{secs} seconds and was stopped"
      zh-CN: 统计超过 %{secs} 秒,已中止
      zh-TW: 統計超過 %{secs} 秒,已中止
    diag_unknown:
      en: "Unknown diagnostics section: %{key}"
      zh-CN: 未知的诊断项:%{key}
      zh-TW: 未知的診斷項:%{key}
    diag_bad_arg:
      en: Invalid target for this action
      zh-CN: 操作目标无效
      zh-TW: 操作目標無效
    diag_signal_failed:
      en: The session has already ended, or you lack permission to signal it
      zh-CN: 会话已结束,或没有权限操作该会话
      zh-TW: 工作階段已結束,或沒有權限操作該工作階段
    analyze_read_only:
      en: EXPLAIN ANALYZE runs the statement, so it is only offered for read-only statements
      zh-CN: EXPLAIN ANALYZE 会真正执行语句,只对只读语句开放
      zh-TW: EXPLAIN ANALYZE 會真正執行語句,只對唯讀語句開放
    analyze_unsupported:
      en: This database does not support EXPLAIN ANALYZE
      zh-CN: 这个数据库不支持 EXPLAIN ANALYZE
      zh-TW: 這個資料庫不支援 EXPLAIN ANALYZE
    invalid_redis_url:
      en: Invalid Redis connection string
      zh-CN: 无效的 Redis 连接串
      zh-TW: 無效的 Redis 連線字串
    sqlite_path_missing:
      en: No SQLite file path specified
      zh-CN: 未指定 SQLite 文件路径
      zh-TW: 未指定 SQLite 檔案路徑
    sqlite_file_not_found:
      en: SQLite file does not exist
      zh-CN: SQLite 文件不存在
      zh-TW: SQLite 檔案不存在
    sqlite_open_failed:
      en: Failed to open SQLite database
      zh-CN: 打开 SQLite 数据库失败
      zh-TW: 開啟 SQLite 資料庫失敗
    import_open_failed:
      en: Couldn't read the file
      zh-CN: 读取文件失败
      zh-TW: 讀取檔案失敗
    import_parse_failed:
      en: Couldn't parse the file
      zh-CN: 解析文件失败
      zh-TW: 解析檔案失敗
    import_bad_line:
      en: "Line %{n}: %{error}"
      zh-CN: "第 %{n} 行:%{error}"
      zh-TW: "第 %{n} 行:%{error}"
    import_not_object:
      en: "Record %{n} isn't a JSON object"
      zh-CN: "第 %{n} 条记录不是 JSON 对象"
      zh-TW: "第 %{n} 筆記錄不是 JSON 物件"
    import_no_table:
      en: Enter a table name
      zh-CN: 请填写表名
      zh-TW: 請填寫資料表名稱
    import_no_columns:
      en: Choose at least one column to import
      zh-CN: 至少选一列导入
      zh-TW: 至少選一欄匯入
    import_empty_column:
      en: Column names can't be empty
      zh-CN: 列名不能为空
      zh-TW: 欄位名稱不能為空
    import_duplicate_column:
      en: "Duplicate column name: %{name}"
      zh-CN: "列名重复:%{name}"
      zh-TW: "欄位名稱重複:%{name}"
    import_create_failed:
      en: Failed to create the table
      zh-CN: 建表失败
      zh-TW: 建立資料表失敗
    import_table_missing:
      en: "Table %{table} doesn't exist"
      zh-CN: "表 %{table} 不存在"
      zh-TW: "資料表 %{table} 不存在"
    import_no_matching_columns:
      en: None of the file's columns match the table's columns
      zh-CN: 文件里没有和表中列名对得上的列
      zh-TW: 檔案裡沒有和資料表欄位名稱對得上的欄
    import_row_failed:
      en: "Row %{n} failed; nothing was imported"
      zh-CN: "第 %{n} 行导入失败,已全部回滚"
      zh-TW: "第 %{n} 列匯入失敗,已全部復原"
    import_cancelled:
      en: Import cancelled
      zh-CN: 导入已取消
      zh-TW: 匯入已取消
    import_running:
      en: An import is already running on this connection
      zh-CN: 这个连接上已有导入在进行
      zh-TW: 這個連線上已有匯入在進行
    keychain_password_not_found:
      en: Password for this connection not found in Keychain
      zh-CN: 钥匙串中未找到该连接的密码
      zh-TW: 鑰匙圈中找不到此連線的密碼
    keychain_write_failed:
      en: Failed to write to Keychain
      zh-CN: 写入钥匙串失败
      zh-TW: 寫入鑰匙圈失敗
    keychain_read_failed:
      en: Failed to read from Keychain
      zh-CN: 读取钥匙串失败
      zh-TW: 讀取鑰匙圈失敗
    keychain_delete_failed:
