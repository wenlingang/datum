[package]
name = "datum-core"
version.workspace = true
edition = "2021"
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"] }
# 流式消费查询结果(行数上限截断时不整体物化)
futures-util = { version = "0.3", default-features = false }
redis = { version = "0.27", features = ["tokio-comp", "tokio-rustls-comp", "tls-rustls-insecure", "tls-rustls-webpki-roots"] }
mysql_async = { version = "0.34", default-features = false, features = ["default-rustls"] }
rusqlite = { version = "0.31", features = ["bundled"] }
thiserror = "1"
keyring = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
dirs = "5"
regex = "1"
sqlformat = "0.5"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ed25519-dalek = "2"
rust-i18n = "4"
tokio-postgres-rustls = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
webpki-roots = "1"

[features]
# 允许用环境变量 DATUM_UPDATE_MANIFEST_URL 覆盖更新清单地址(仅测试用,正式包不开启)
update-override = []
