[package]
name = "datum-core"
version.workspace = true
edition = "2021"
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"] }
# 流式消费查询结果(行数上限截断时不整体物化)
futures-util = { version = "0.3", default-features = false }
redis = { version = "0.27", features = ["tokio-comp", "tokio-rustls-comp", "tls-rustls-insecure", "tls-rustls-webpki-roots"] }
mysql_async = { version = "0.34", default-features = false, features = ["default-rustls"] }
rusqlite = { version = "0.31", features = ["bundled"] }
mongodb = { version = "3.9", default-features = false, features = ["compat-3-0-0", "rustls-tls", "dns-resolver"] }
base64 = "0.22"
thiserror = "1"
keyring = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
dirs = "5"
regex = "1"
sqlformat = "0.5"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rust-i18n = "4"
tokio-postgres-rustls = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
webpki-roots = "1"
# SSH 隧道:纯 Rust 客户端,加密后端与 TLS 一致用 ring
russh = { version = "0.65", default-features = false, features = ["ring", "flate2"] }
# known_hosts 哈希主机名(与 russh 同版本)
hmac = "0.13"
sha1 = "0.11"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
# 结果导出 Excel(.xlsx)
rust_xlsxwriter = { version = "0.102", default-features = false }
# SQLite 导入 CSV / JSON:流式解析 CSV;GBK 等编码转成 UTF-8(encoding_rs 系列已在依赖树里)
csv = "1.4"
encoding_rs = "0.8"
encoding_rs_io = "0.1"
# Redis 值的格式识别:MessagePack 无 schema 解码;gzip / zlib 解压(flate2 已在依赖树里,mysql_async、russh 都用)
rmpv = { version = "1.3", default-features = false }
flate2 = "1"
