[package]
name = "datum"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Datum - 简约现代的桌面数据库管理工具"

[dependencies]
datum-core.workspace = true
gpui-kit.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
lsp-types = { version = "0.97", features = ["proposed"] }
rust-embed = { version = "8", features = ["include-exclude"] }
uuid = { version = "1", features = ["v4"] }
dirs = "5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
resvg = "0.45"
gpui-pre = { version = "=0.3.9", optional = true, features = ["test-support"] }
gpui-pre-platform = { version = "=0.3.9", optional = true, features = ["test-support"] }
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }
rust-i18n = "4"
sys-locale = "0.3"

[features]
# 开发用:无窗口渲染截图(DATUM_SNAPSHOT),依赖 GPUI 的 Metal 无头渲染器
snapshot = ["dep:gpui-pre", "dep:gpui-pre-platform", "dep:image", "datum-core/update-override"]
