    en: "The following %{what} will run on %{target}:"
    zh-CN: "将在 %{target} 上执行以下 %{what}:"
    zh-TW: "將在 %{target} 上執行以下 %{what}:"
  run_in_editor:
    en: Run in Editor
    zh-CN: 编辑器运行
