    zh-CN: 还原
    zh-TW: 還原
  revert_tooltip:
    en: Revert to the AI-generated original
    zh-CN: 还原为 AI 生成的原文
    zh-TW: 還原為 AI 產生的原文
  format:
    en: Format
    zh-CN: 格式化
    zh-TW: 格式化
  format_tooltip:
    en: Format (normalize indentation and keyword case)
    zh-CN: 格式化(统一缩进与关键字大小写)
    zh-TW: 格式化(統一縮排與關鍵字大小寫)
  running:
    en: Running…
    zh-CN: 执行中…
    zh-TW: 執行中…
  executed:
    en: Executed
    zh-CN: 已执行
    zh-TW: 已執行
  run:
    en: Run
    zh-CN: 执行
    zh-TW: 執行
  run_tooltip:
    en: Run (asks for confirmation)
    zh-CN: 执行(先确认)
    zh-TW: 執行(需先確認)
  run_tooltip_destructive:
    en: Contains destructive statements; review carefully before running
    zh-CN: 包含破坏性语句,执行前请仔细确认
    zh-TW: 包含破壞性陳述式,執行前請仔細確認
  run_in_editor_tooltip:
