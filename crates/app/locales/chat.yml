_version: 2
chat:
  title:
    en: AI Assistant
    zh-CN: AI 助手
    zh-TW: AI 助理
  placeholder_ask:
    en: Ask anything…
    zh-CN: 问点什么…
    zh-TW: 問點什麼…
  placeholder_no_conn:
    en: Select a SQL database connection on the left first
    zh-CN: 请先在左侧选择一个 SQL 数据库连接
    zh-TW: 請先在左側選擇一個 SQL 資料庫連線
  placeholder_not_ready:
    en: AI isn't ready. Check Settings.
    zh-CN: AI 未就绪,请检查设置
    zh-TW: AI 尚未就緒,請檢查設定
  placeholder_busy:
    en: Another conversation is generating, please wait…
    zh-CN: 另一个会话正在生成中,请稍候…
    zh-TW: 另一個對話正在產生中,請稍候…
  # 发给 AI 的引用包装:后接 SQL 代码块
  quoted_sql:
    en: "Quoted SQL:"
    zh-CN: "引用的 SQL:"
    zh-TW: "引用的 SQL:"
  not_bound:
    en: This conversation isn't bound to a connection
    zh-CN: 会话未绑定连接
    zh-TW: 對話尚未綁定連線
  # 以下为执行结果回灌给 AI 的消息片段
  stmt_n:
    en: "Statement %{n}"
    zh-CN: "第 %{n} 条"
    zh-TW: "第 %{n} 條"
  returned_rows:
    en: "Returned %{count} rows"
    zh-CN: "返回 %{count} 行"
    zh-TW: "傳回 %{count} 列"
  succeeded:
    en: Succeeded
    zh-CN: 成功
    zh-TW: 成功
  affected_rows:
    en: ", %{count} rows affected"
    zh-CN: ",影响 %{count} 行"
    zh-TW: ",影響 %{count} 列"
  labeled:
    en: "%{label}: %{brief}"
    zh-CN: "%{label}:%{brief}"
    zh-TW: "%{label}:%{brief}"
  execution:
    en: Execution
    zh-CN: 执行
    zh-TW: 執行
  failed:
    en: "%{label} failed: %{error}"
    zh-CN: "%{label}失败:%{error}"
    zh-TW: "%{label}失敗:%{error}"
  executed_tag:
    en: "[Executed]"
    zh-CN: "[已执行]"
    zh-TW: "[已執行]"
  result_label:
    en: "Result: "
    zh-CN: "结果:"
    zh-TW: "結果:"
  thinking:
    en: Thinking
    zh-CN: 思考中
    zh-TW: 思考中
  select_model:
    en: Select Model
    zh-CN: 选择模型
    zh-TW: 選擇模型
  switch_model:
    en: Switch Model
    zh-CN: 切换模型
    zh-TW: 切換模型
  manage_providers:
    en: Manage Providers & Models…
    zh-CN: 管理服务商与模型…
    zh-TW: 管理服務商與模型…
  clear:
    en: Clear
    zh-CN: 清空
    zh-TW: 清除
  clear_tooltip:
    en: Clear Conversation
    zh-CN: 清空对话
    zh-TW: 清除對話
  unavailable:
    en: AI is unavailable
    zh-CN: AI 暂不可用
    zh-TW: AI 暫時無法使用
  open_settings:
    en: Open Settings
    zh-CN: 打开设置
    zh-TW: 開啟設定
  bound_notice:
    en: "This conversation is bound to %{label}, and SQL still runs on that connection. Clear the conversation to switch."
    zh-CN: "对话绑定于 %{label},SQL 仍将在该连接执行;要切换请先清空对话。"
    zh-TW: "對話已綁定至 %{label},SQL 仍會在該連線執行;若要切換請先清除對話。"
  empty_intro:
    en: "Generate SQL with natural language, for example:"
    zh-CN: "用自然语言生成 SQL,例如:"
    zh-TW: "用自然語言產生 SQL,例如:"
  empty_example_create:
    en: "\"Create a users table with id, name, and email\""
    zh-CN: 「新建一张 users 表,含 id、name、email」
    zh-TW: 「建立一張 users 資料表,包含 id、name、email」
  empty_example_seed:
    en: "\"Seed the users table with 10 rows of test data\""
    zh-CN: 「给 users 表初始化 10 条测试数据」
    zh-TW: 「為 users 資料表建立 10 筆測試資料」
  empty_confirm:
    en: Generated SQL runs only after you confirm it.
    zh-CN: 生成的 SQL 需你确认后才会执行。
    zh-TW: 產生的 SQL 需經你確認後才會執行。
  fix:
    en: Ask AI to Fix
    zh-CN: 让 AI 修复
    zh-TW: 讓 AI 修正
  # 「让 AI 修复」发给 AI 的消息
  fix_prompt:
    en: The previous SQL failed. Please fix it based on the error message and provide it again.
    zh-CN: 上一条 SQL 执行失败了,请根据错误信息修正后重新给出。
    zh-TW: 上一段 SQL 執行失敗了,請根據錯誤訊息修正後重新提供。
  quote:
    en: Quote
    zh-CN: 引用
    zh-TW: 引用
  remove_quote:
    en: Remove Quote
    zh-CN: 移除引用
    zh-TW: 移除引用
  quote_selection:
    en: Quote Selection
    zh-CN: 引用选中
    zh-TW: 引用選取
  quote_selection_tooltip:
    en: Quote the SQL selected in the editor
    zh-CN: 引用编辑器中选中的 SQL
    zh-TW: 引用編輯器中選取的 SQL
  send_tooltip:
    en: Send (Enter)
    zh-CN: 发送(Enter)
    zh-TW: 傳送(Enter)
  input_hint:
    en: Enter to send · ⇧Enter for new line
    zh-CN: Enter 发送 · ⇧Enter 换行
    zh-TW: Enter 傳送 · ⇧Enter 換行
sql_card:
  n_statements:
    en: "%{count} statements"
    zh-CN: "%{count} 条语句"
    zh-TW: "%{count} 個陳述式"
  statement:
    en: statement
    zh-CN: 语句
    zh-TW: 陳述式
