    en: Contains destructive statements (DROP / TRUNCATE / DELETE or UPDATE without WHERE). This can't be undone.
    zh-CN: 包含破坏性语句(DROP / TRUNCATE / 无 WHERE 的 DELETE 或 UPDATE),不可撤销。
    zh-TW: 包含破壞性陳述式(DROP / TRUNCATE / 無 WHERE 的 DELETE 或 UPDATE),無法復原。
  cancel:
    en: Cancel
    zh-CN: 取消
    zh-TW: 取消
  confirm_run_in_editor:
    en: Run in Editor
    zh-CN: 确认编辑器运行
    zh-TW: 確認在編輯器執行
  confirm_run:
    en: Run
    zh-CN: 确认执行
    zh-TW: 確認執行
  ai_generated:
    en: AI Generated
    zh-CN: AI 生成
    zh-TW: AI 產生
  edited:
