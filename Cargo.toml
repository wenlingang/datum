[workspace]
members = ["crates/core"]
# nsh 应用(app/)与其原生模块(app/native)由 nsh CLI 单独构建
exclude = ["app"]
resolver = "2"

[workspace.package]
# 发版版本号的唯一来源是 app/nsh.json 的 "version";这里只是 core 的 crate 版本
version = "0.1.1"
edition = "2024"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "process", "io-util", "time"] }
