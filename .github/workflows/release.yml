# 发版:推送 v* 附注标签(如 v0.0.1)后自动 校验版本 → 测试 → 构建 → 签名打包 → 建 Release。
#
# 标签必须与 Cargo.toml 的 version 一致;附注标签(git tag -a)的说明会作为更新说明,
# 显示在应用「关于与更新」里。带 `-` 的版本(如 v0.1.0-rc1)发为预发布,不会成为
# releases/latest,已安装的应用不会更新到它。
# Release 附件:Datum-<版本>.dmg(及 .sha256)、Datum.dmg(固定名,下载链接不过期)、
# latest.json(应用通过 releases/latest/download/latest.json 检查更新)。
#
# 手动运行(Actions › Release › Run workflow)只打包不发布,产物作为 artifact 供下载试装。
#
# 仓库 Settings → Secrets and variables → Actions(由 script/release-cert.sh 一次性生成):
#   RELEASE_CERT_P12       自签名发版证书 "Datum Release" 的 .p12,base64 编码
#   RELEASE_CERT_PASSWORD  该 .p12 的密码
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: 校验标签与版本号一致
        if: startsWith(github.ref, 'refs/tags/')
        run: script/check-version.sh "$GITHUB_REF_NAME"
      - run: cargo test --workspace --locked
      # 证书进入 runner 之前先把所有东西编译好:crates.io 的 build script 和过程宏
      # 绝不能在发版私钥已解锁时运行。下面 package.sh 里的 cargo build 只是命中缓存。
      - name: 构建(导入证书之前)
        run: |
          cargo build --release --locked -p datum --target aarch64-apple-darwin
          cargo build --release --locked -p datum --target x86_64-apple-darwin
      - name: 导入签名证书
        env:
          P12: ${{ secrets.RELEASE_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.RELEASE_CERT_PASSWORD }}
        run: script/ci-import-cert.sh
      - name: 打包
        run: script/package.sh
      - name: 上传试装产物
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: datum-dmg
          path: target/release-dist/Datum-*.dmg*
      - name: 创建 GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(script/app-version.sh)
          dmg="target/release-dist/Datum-$version.dmg"
          sha=$(cut -d' ' -f1 "$dmg.sha256")
          script/release-notes.sh "$version" "$sha" > "$RUNNER_TEMP/notes.md"
          # 附注标签的说明就是应用内更新对话框里显示的更新说明
          git fetch --force --depth=1 origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" | sed '/^-----BEGIN PGP/,$d' > "$RUNNER_TEMP/update-notes.txt"
          script/update-manifest.sh "$version" "$sha" "$(stat -f %z "$dmg")" "$RUNNER_TEMP/update-notes.txt" > "$RUNNER_TEMP/latest.json"
          # 预发布(vX.Y.Z-rc1)不能成为 releases/latest,所有已安装的应用都会更新到 latest
          prerelease=()
          [[ $version == *-* ]] && prerelease=(--prerelease)
          # 不带版本号的副本:releases/latest/download/Datum.dmg 是永不过期的下载链接
          cp "$dmg" "$RUNNER_TEMP/Datum.dmg"
          gh release create "$GITHUB_REF_NAME" "$dmg" "$dmg.sha256" "$RUNNER_TEMP/latest.json" "$RUNNER_TEMP/Datum.dmg" \
            --title "Datum $version" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes "${prerelease[@]}"
      - name: 删除临时钥匙串
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2>/dev/null || true
