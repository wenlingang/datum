# 日常 CI:推到 main 或提 PR 时跑核心测试。
#
# 另一个作用是预热缓存:GitHub 规定标签触发的运行只能读到自己和默认分支(main)上写的缓存,
# 所以在 main 上编译好 nsh CLI(四个平台)与依赖,发版(release.yml)时就能直接复用,
# 不必每次都从源码编译 nsh(约 20 分钟)。
name: CI

# 推到 main 时只在 nsh 版本或依赖变化(app/native/Cargo.toml、Cargo.lock)或缓存方式变化时跑,用来预热缓存;
# 平时可在 Actions 页面手动触发;PR 照常跑核心测试。
on:
  push:
    branches: [main]
    paths:
      - "app/native/Cargo.toml"
      - "app/native/Cargo.lock"
      - ".github/actions/setup-nsh/**"
      - ".github/actions/package-cache/**"
      - "script/install-nsh.sh"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            app/native
      - uses: ./.github/actions/setup-nsh
      - run: cargo test --workspace --locked
      - name: 类型检查与构建
        working-directory: app
        run: |
          nsh check
          nsh build 2>&1 | tee "$RUNNER_TEMP/build.log"
          ! grep -q '^warn' "$RUNNER_TEMP/build.log"
      - name: 核心界面测试(临时配置目录)
        run: app/testing/run-tests.sh core

  # 只在 main 上(非 PR):四个平台各打一次包,保存 nsh CLI 与打包编译缓存,发版时直接复用。
  # 只编译、不签名、不上传产物。
  warm-package:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: macos, arch: aarch64 }
          - { os: macos-15-intel, target: macos, arch: x86_64 }
          - { os: windows-2022, target: windows, arch: x86_64 }
          - { os: ubuntu-24.04, target: linux, arch: x86_64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/package-cache
        with:
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          save: "true"
      - name: Linux 构建依赖
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev build-essential pkg-config \
            libgtk-4-dev libwebkitgtk-6.0-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - uses: ./.github/actions/setup-nsh
      - name: 打包(只为编译缓存)
        working-directory: app
        run: nsh package --target ${{ matrix.target }}
