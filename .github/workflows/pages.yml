# 介绍页:site/ 或截图有改动时部署到 GitHub Pages(https://wenlingang.github.io/datum/)。
name: Pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/screenshots/**
      - assets/icons/128x128@2x.png
      - script/build-site.sh
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: script/build-site.sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
