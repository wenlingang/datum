        zh-CN: "版本、库大小、连接数与缓存命中率;统计值从重置时间起累计。"
        zh-TW: "版本、資料庫大小、連線數與快取命中率;統計值自重設時間起累計。"
      sessions:
        en: "Client sessions (excluding this one). Active first, then idle-in-transaction."
        zh-CN: "客户端会话(不含当前连接);进行中的排前面,其次是事务中空闲。"
        zh-TW: "用戶端工作階段(不含目前連線);進行中的排前面,其次是交易中閒置。"
      locks:
        en: "Who is waiting on whom. Terminating the blocking session usually releases the wait."
        zh-CN: "谁在等谁;终止阻塞方的会话通常就能放行。"
        zh-TW: "誰在等誰;終止阻塞方的工作階段通常就能放行。"
      long_tx:
        en: "Transactions open for more than 30 seconds; they hold locks and stop vacuum from cleaning up."
        zh-CN: "打开超过 30 秒的事务:会持有锁、阻止 vacuum 回收。"
        zh-TW: "開啟超過 30 秒的交易:會持有鎖、阻止 vacuum 回收。"
      slow:
        en: "Top 50 statements in this database by total time, from pg_stat_statements."
        zh-CN: "按总耗时排序的前 50 条语句(本库),来自 pg_stat_statements。"
        zh-TW: "依總耗時排序的前 50 條語句(本資料庫),來自 pg_stat_statements。"
      unused_indexes:
        en: "Indexes never scanned since statistics were reset (primary keys, unique and constraint indexes excluded). Check replicas before dropping."
        zh-CN: "自统计重置以来从未被扫描的索引(已排除主键、唯一和约束索引);删除前确认只读副本上也没用到。"
        zh-TW: "自統計重設以來從未被掃描的索引(已排除主鍵、唯一與約束索引);刪除前確認唯讀副本上也沒用到。"
      bloat:
        en: "Tables with the most dead rows, and when they were last vacuumed / analyzed."
        zh-CN: "死行最多的表,以及上次 vacuum / analyze 的时间。"
        zh-TW: "死列最多的表,以及上次 vacuum / analyze 的時間。"
    mysql:
      overview:
        en: "Version, schema size, connections, buffer pool hit rate and QPS since startup."
        zh-CN: "版本、库大小、连接数、缓冲池命中率与启动以来的 QPS。"
        zh-TW: "版本、資料庫大小、連線數、緩衝池命中率與啟動以來的 QPS。"
      sessions:
        en: "Threads from the process list (excluding this one); sleeping threads last."
        zh-CN: "进程列表里的线程(不含当前连接),Sleep 的排最后。"
        zh-TW: "處理程序清單裡的執行緒(不含目前連線),Sleep 的排最後。"
      locks:
        en: "InnoDB lock waits: who is waiting on whom. Killing the blocking thread releases the wait."
        zh-CN: "InnoDB 锁等待:谁在等谁;断开阻塞方线程即可放行。"
        zh-TW: "InnoDB 鎖等待:誰在等誰;中斷阻塞方執行緒即可放行。"
      long_tx:
        en: "Open InnoDB transactions, oldest first."
        zh-CN: "进行中的 InnoDB 事务,最老的在前。"
        zh-TW: "進行中的 InnoDB 交易,最舊的在前。"
      slow:
        en: "Top 50 statement digests by total time, from performance_schema (all schemas)."
        zh-CN: "按总耗时排序的前 50 类语句(所有库),来自 performance_schema。"
        zh-TW: "依總耗時排序的前 50 類語句(所有資料庫),來自 performance_schema。"
      unused_indexes:
        en: "Indexes in this schema with no reads since server start (sys.schema_unused_indexes)."
        zh-CN: "本库中自服务启动以来没有被读过的索引(sys.schema_unused_indexes)。"
        zh-TW: "本資料庫中自服務啟動以來沒有被讀過的索引(sys.schema_unused_indexes)。"
      tables:
        en: "Tables in this schema by size; a large free space means OPTIMIZE TABLE could reclaim it."
        zh-CN: "本库各表按大小排序;空闲空间大说明 OPTIMIZE TABLE 可回收。"
        zh-TW: "本資料庫各表依大小排序;閒置空間大表示 OPTIMIZE TABLE 可回收。"
    sqlite:
      overview:
        en: "File size, free pages and settings. VACUUM rewrites the file to reclaim free pages; ANALYZE refreshes planner statistics."
        zh-CN: "文件大小、空闲页与设置。VACUUM 重写文件回收空闲页;ANALYZE 更新查询规划统计。"
        zh-TW: "檔案大小、閒置頁與設定。VACUUM 重寫檔案回收閒置頁;ANALYZE 更新查詢規劃統計。"
      tables:
        en: "Space used by each table and index (dbstat)."
        zh-CN: "每张表和索引占用的空间(dbstat)。"
        zh-TW: "每張表與索引占用的空間(dbstat)。"
      integrity:
        en: "PRAGMA integrity_check: a single \"ok\" means the file is healthy (at most 100 problems are listed)."
        zh-CN: "PRAGMA integrity_check:只有一行 ok 表示文件完好(最多列出 100 个问题)。"
        zh-TW: "PRAGMA integrity_check:只有一列 ok 表示檔案完好(最多列出 100 個問題)。"
  unavailable:
    pg_stat_statements_missing:
      en: "The pg_stat_statements extension is not installed in this database. Add it to shared_preload_libraries, restart, then run CREATE EXTENSION pg_stat_statements."
      zh-CN: "本库没有安装 pg_stat_statements 扩展:把它加入 shared_preload_libraries 并重启,再执行 CREATE EXTENSION pg_stat_statements。"
      zh-TW: "本資料庫沒有安裝 pg_stat_statements 擴充:把它加入 shared_preload_libraries 並重啟,再執行 CREATE EXTENSION pg_stat_statements。"
    pg_stat_statements_not_loaded:
      en: "pg_stat_statements is installed but not loaded: add it to shared_preload_libraries and restart the server."
      zh-CN: "pg_stat_statements 已安装但未加载:需加入 shared_preload_libraries 并重启服务。"
      zh-TW: "pg_stat_statements 已安裝但未載入:需加入 shared_preload_libraries 並重啟服務。"
    performance_schema_off:
      en: "performance_schema is disabled on this server (performance_schema = ON in my.cnf, then restart)."
      zh-CN: "服务器未开启 performance_schema(在 my.cnf 设 performance_schema = ON 后重启)。"
      zh-TW: "伺服器未開啟 performance_schema(在 my.cnf 設 performance_schema = ON 後重啟)。"
    privilege:
      en: "The current user lacks the privilege for this view (usually PROCESS, or SELECT on performance_schema / sys)."
      zh-CN: "当前用户没有查看权限(通常需要 PROCESS,或 performance_schema / sys 的 SELECT 权限)。"
      zh-TW: "目前使用者沒有檢視權限(通常需要 PROCESS,或 performance_schema / sys 的 SELECT 權限)。"
    my_sys_missing:
      en: "The required system view is not available on this server (sys schema missing, or a MySQL variant without it)."
      zh-CN: "服务器上没有所需的系统视图(缺少 sys 库,或是不带它的 MySQL 分支)。"
      zh-TW: "伺服器上沒有所需的系統檢視(缺少 sys 資料庫,或是不帶它的 MySQL 分支)。"
    dbstat_missing:
      en: "This SQLite build has no dbstat table, so per-table sizes are unavailable."
      zh-CN: "当前 SQLite 未编入 dbstat,无法统计每张表的空间。"
      zh-TW: "目前 SQLite 未編入 dbstat,無法統計每張表的空間。"
