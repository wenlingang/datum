    en: "Draft DROP INDEX"
    zh-CN: "生成 DROP INDEX"
    zh-TW: "產生 DROP INDEX"
  drop_index_note:
    en: "Unused since statistics were last reset. Make sure no query, constraint or rarely-run job needs it before dropping."
    zh-CN: "自统计上次重置以来没被用过。删除前确认没有查询、约束或低频任务依赖它。"
    zh-TW: "自統計上次重置以來沒被用過。刪除前確認沒有查詢、約束或低頻任務依賴它。"
  placeholders_note:
    en: "The statement is normalized: placeholders became :p1, :p2 … — fill in real values when asked"
    zh-CN: "语句是归一化后的:占位符已换成 :p1、:p2 …,执行时按提示填入实际值"
    zh-TW: "語句是正規化後的:佔位符已換成 :p1、:p2 …,執行時依提示填入實際值"
  confirm:
    optimize_table:
      title:
        en: "Optimize table %{target}?"
        zh-CN: "整理表 %{target}?"
        zh-TW: "整理資料表 %{target}?"
      body:
        en: "Runs OPTIMIZE TABLE to reclaim free space. On InnoDB this rebuilds the table: it can take a while on large tables and needs free disk space about the size of the table."
        zh-CN: "执行 OPTIMIZE TABLE 回收空闲空间。InnoDB 上会重建整张表:大表耗时较长,并需要约等于表大小的空闲磁盘。"
        zh-TW: "執行 OPTIMIZE TABLE 回收閒置空間。InnoDB 上會重建整張表:大表耗時較長,並需要約等於表大小的閒置磁碟。"
    cancel:
      title:
        en: "Cancel the query of session %{target}?"
        zh-CN: "取消会话 %{target} 当前的查询?"
        zh-TW: "取消工作階段 %{target} 目前的查詢?"
      body:
        en: "Runs pg_cancel_backend: the running statement is aborted, the session stays connected."
        zh-CN: "执行 pg_cancel_backend:中止正在执行的语句,会话保持连接。"
        zh-TW: "執行 pg_cancel_backend:中止正在執行的語句,工作階段保持連線。"
    terminate:
      title:
        en: "Terminate session %{target}?"
        zh-CN: "终止会话 %{target}?"
        zh-TW: "終止工作階段 %{target}?"
      body:
        en: "Runs pg_terminate_backend: the connection is closed and its open transaction is rolled back."
        zh-CN: "执行 pg_terminate_backend:断开该连接,未提交的事务会回滚。"
        zh-TW: "執行 pg_terminate_backend:中斷該連線,未提交的交易會回滾。"
    kill_query:
      title:
        en: "Kill the query of thread %{target}?"
        zh-CN: "中止线程 %{target} 当前的查询?"
        zh-TW: "中止執行緒 %{target} 目前的查詢?"
      body:
        en: "Runs KILL QUERY: the running statement is aborted, the connection stays open."
        zh-CN: "执行 KILL QUERY:中止正在执行的语句,连接保留。"
        zh-TW: "執行 KILL QUERY:中止正在執行的語句,連線保留。"
    kill:
      title:
        en: "Kill thread %{target}?"
        zh-CN: "断开线程 %{target}?"
        zh-TW: "中斷執行緒 %{target}?"
      body:
        en: "Runs KILL: the connection is closed and its open transaction is rolled back."
        zh-CN: "执行 KILL:断开该连接,未提交的事务会回滚。"
        zh-TW: "執行 KILL:中斷該連線,未提交的交易會回滾。"
    vacuum_table:
      title:
        en: "VACUUM %{target}?"
        zh-CN: "对 %{target} 执行 VACUUM?"
        zh-TW: "對 %{target} 執行 VACUUM?"
      body:
        en: "Runs VACUUM (ANALYZE): reclaims dead rows and refreshes statistics. It does not lock out reads or writes, but adds I/O load."
        zh-CN: "执行 VACUUM (ANALYZE):回收死行并更新统计;不阻塞读写,但会增加 I/O。"
        zh-TW: "執行 VACUUM (ANALYZE):回收死列並更新統計;不阻塞讀寫,但會增加 I/O。"
    vacuum:
      title:
        en: "VACUUM this database?"
        zh-CN: "对整个库执行 VACUUM?"
        zh-TW: "對整個資料庫執行 VACUUM?"
      body:
        en: "Rewrites the whole file to reclaim free pages. The database is locked while it runs and needs free disk space about the size of the file."
        zh-CN: "重写整个文件以回收空闲页;执行期间库被锁住,需要约等于文件大小的空闲磁盘。"
        zh-TW: "重寫整個檔案以回收閒置頁;執行期間資料庫被鎖住,需要約等於檔案大小的閒置磁碟。"
    analyze:
      title:
        en: "ANALYZE this database?"
        zh-CN: "对整个库执行 ANALYZE?"
        zh-TW: "對整個資料庫執行 ANALYZE?"
      body:
        en: "Collects statistics for the query planner. Data is not changed."
        zh-CN: "收集查询规划用的统计信息,不改动数据。"
        zh-TW: "收集查詢規劃用的統計資訊,不改動資料。"
