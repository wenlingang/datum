    zh-CN: "这里按列名列出已加载表里认出的列;只能从取值认出的列(如查询里的表达式列)在出结果时自动遮罩。在表头上右键可以遮罩或取消遮罩某一列。"
    zh-TW: "這裡依欄名列出已載入資料表裡辨識出的欄;只能從值辨識的欄(如查詢裡的運算式欄)在出結果時自動遮罩。在表頭上按右鍵可以遮罩或取消遮罩某一欄。"
