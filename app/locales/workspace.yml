    zh-CN: "遮罩后的列在网格、行详情、复制、导出和发给 AI 的内容里都显示成 a***@example.com、138****1234 这样。预发和生产连接默认打开。"
    zh-TW: "遮罩後的欄在網格、列詳細資料、複製、匯出和傳給 AI 的內容裡都顯示成 a***@example.com、138****1234 這樣。預備和正式連線預設開啟。"
