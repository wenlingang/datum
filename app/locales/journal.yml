  empty_filtered:
    en: "No writes match the filters"
    zh-CN: "没有符合筛选条件的写操作"
    zh-TW: "沒有符合篩選條件的寫入操作"
  empty_hint:
    en: "Every write Datum runs here — from the editor, AI, grid edits, imports and undo — is kept on this computer with what it changed, and can be undone later, even after a restart."
    zh-CN: "Datum 在这里执行的每次写操作(编辑器、AI、表格编辑、导入、撤销)都记在本机,连同改动了什么;之后也能撤销,重启之后也行。"
    zh-TW: "Datum 在這裡執行的每次寫入操作(編輯器、AI、表格編輯、匯入、復原)都記在本機,連同變動了什麼;之後也能復原,重新啟動之後也行。"
  loading:
    en: "Loading…"
    zh-CN: "加载中…"
    zh-TW: "載入中…"
  pick:
    en: "Select an entry to see the full statement and the rows before the change"
    zh-CN: "选一条记录,查看完整语句与改动前的行"
    zh-TW: "選一筆紀錄,查看完整陳述式與變動前的資料列"
  today:
