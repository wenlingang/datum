    en: "Every recorded write of this connection is removed, including the data kept for undo. This can't be reversed."
    zh-CN: "这个连接记下的全部写操作都会删掉,包括撤销用的数据。删掉后不能恢复。"
    zh-TW: "這個連線記下的全部寫入操作都會刪除,包括復原用的資料。刪除後無法還原。"
